  1. Prevent padding and border from affecting element width. (https://github.com/mozdevs/cssremedy/issues/4)
  2. Remove default margins and padding
  3. Reset all borders.
*/

*,
::after,
::before,
::backdrop,
::file-selector-button {
  box-sizing: border-box; /* 1 */
  margin: 0; /* 2 */
  padding: 0; /* 2 */
  border: 0 solid; /* 3 */
}

/*
  1. Use a consistent sensible line-height in all browsers.
  2. Prevent adjustments of font size after orientation changes in iOS.
  3. Use a more readable tab size.
  4. Use the user's configured `sans` font-family by default.
  5. Use the user's configured `sans` font-feature-settings by default.
  6. Use the user's configured `sans` font-variation-settings by default.
  7. Disable tap highlights on iOS.
*/

html,
:host {
  line-height: 1.5; /* 1 */
  -webkit-text-size-adjust: 100%; /* 2 */
  tab-size: 4; /* 3 */
  font-family: --theme(
    --default-font-family,
    ui-sans-serif,
    system-ui,
    sans-serif,
    'Apple Color Emoji',
    'Segoe UI Emoji',
    'Segoe UI Symbol',
    'Noto Color Emoji'
  ); /* 4 */
  font-feature-settings: --theme(--default-font-feature-settings, normal); /* 5 */
  font-variation-settings: --theme(--default-font-variation-settings, normal); /* 6 */
  -webkit-tap-highlight-color: transparent; /* 7 */
}

/*
  1. Add the correct height in Firefox.
  2. Correct the inheritance of border color in Firefox. (https://bugzilla.mozilla.org/show_bug.cgi?id=190655)
  3. Reset the default border style to a 1px solid border.
*/

hr {
  height: 0; /* 1 */
  color: inherit; /* 2 */
  border-top-width: 1px; /* 3 */
}

/*
  Add the correct text decoration in Chrome, Edge, and Safari.
*/

abbr:where([title]) {
  -webkit-text-decoration: underline dotted;
  text-decoration: underline dotted;
}

/*
  Remove the default font size and weight for headings.
*/

h1,
h2,
h3,
h4,
h5,
h6 {
  font-size: inherit;
  font-weight: inherit;
}

/*
  Reset links to optimize for opt-in styling instead of opt-out.
*/

a {
  color: inherit;
  -webkit-text-decoration: inherit;
  text-decoration: inherit;
}

/*
  Add the correct font weight in Edge and Safari.
*/

b,
strong {
  font-weight: bolder;
}

/*
  1. Use the user's configured `mono` font-family by default.
  2. Use the user's configured `mono` font-feature-settings by default.
  3. Use the user's configured `mono` font-variation-settings by default.
  4. Correct the odd `em` font sizing in all browsers.
*/

code,
kbd,
samp,
pre {
  font-family: --theme(
    --default-mono-font-family,
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    'Liberation Mono',
    'Courier New',
    monospace
  ); /* 1 */
  font-feature-settings: --theme(--default-mono-font-feature-settings, normal); /* 2 */
  font-variation-settings: --theme(--default-mono-font-variation-settings, normal); /* 3 */
  font-size: 1em; /* 4 */
}

/*
  Add the correct font size in all browsers.
*/

small {
  font-size: 80%;
}

/*
  Prevent `sub` and `sup` elements from affecting the line height in all browsers.
*/

sub,
sup {
  font-size: 75%;
  line-height: 0;
  position: relative;
  vertical-align: baseline;
}

sub {
  bottom: -0.25em;
}

sup {
  top: -0.5em;
}

/*
  1. Remove text indentation from table contents in Chrome and Safari. (https://bugs.chromium.org/p/chromium/issues/detail?id=999088, https://bugs.webkit.org/show_bug.cgi?id=201297)
  2. Correct table border color inheritance in all Chrome and Safari. (https://bugs.chromium.org/p/chromium/issues/detail?id=935729, https://bugs.webkit.org/show_bug.cgi?id=195016)
  3. Remove gaps between table borders by default.
*/

table {
  text-indent: 0; /* 1 */
  border-color: inherit; /* 2 */
  border-collapse: collapse; /* 3 */
}

/*
  Use the modern Firefox focus style for all focusable elements.
*/

  outline: auto;
}

/*
  Add the correct vertical alignment in Chrome and Firefox.
*/

progress {
  vertical-align: baseline;
}

/*
  Add the correct display in Chrome and Safari.
*/

summary {
  display: list-item;
}

/*
  Make lists unstyled by default.
*/

ol,
ul,

  list-style: none;
}

/*
  1. Make replaced elements `display: block` by default. (https://github.com/mozdevs/cssremedy/issues/14)
  2. Add `vertical-align: middle` to align replaced elements more sensibly by default. (https://github.com/jensimmons/cssremedy/issues/14#issuecomment-634934210)

*/

img,
svg,
video,
canvas,
audio,
iframe,
embed,
object {
  display: block; /* 1 */
  vertical-align: middle; /* 2 */
}

*/

video {
  max-width: 100%;
  height: auto;
}

/*
  1. Inherit font styles in all browsers.
  2. Remove border radius in all browsers.
  3. Remove background color in all browsers.
  4. Ensure consistent opacity for disabled states in all browsers.

input,
select,
optgroup,
textarea,

  font: inherit; /* 1 */
  font-feature-settings: inherit; /* 1 */
  font-variation-settings: inherit; /* 1 */
  letter-spacing: inherit; /* 1 */
  color: inherit; /* 1 */
  border-radius: 0; /* 2 */
  background-color: transparent; /* 3 */
  opacity: 1; /* 4 */
}

:where(select:is([multiple], [size])) optgroup {
  font-weight: bolder;
}

/*

*/

  padding-inline-start: 20px;
}

}

*/

}

  Set the default placeholder color to a semi-transparent version of the current text color in browsers that do not

*/

  (contain-intrinsic-size: 1px) /* Safari 17+ */ {

    color: color-mix(in oklab, currentcolor 50%, transparent);
  }

/*

*/

  resize: vertical;
}

/*
  Remove the inner padding in Chrome and Safari on macOS.
*/

}

::-webkit-datetime-edit-year-field,
::-webkit-datetime-edit-month-field,
::-webkit-datetime-edit-day-field,
::-webkit-datetime-edit-hour-field,
::-webkit-datetime-edit-minute-field,
::-webkit-datetime-edit-second-field,
::-webkit-datetime-edit-millisecond-field,
::-webkit-datetime-edit-meridiem-field {

:root{--font-geist-sans:system-ui;--font-geist-mono:ui-monospace}


:root {
  --ink: #17243b;
  --muted: #6c7b91;
  --line: #e5eaf1;
  --paper: #ffffff;
  --canvas: #f6f9fc;
  --blue: #1967d2;
  --blue-dark: #1253aa;
  --blue-soft: #edf5ff;
  --green: #0b8f6a;
  --green-soft: #eaf8f3;
  --amber: #ba6a00;
  --amber-soft: #fff5df;
  --shadow: 0 16px 50px rgba(35, 59, 91, 0.08);
}
.font-size-small { --font-offset: -1px; }
.font-size-medium { --font-offset: 0px; }
.font-size-large { --font-offset: 3px; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-geist-sans), "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { color: inherit; }
a { color: inherit; }

.app-shell { min-height: 100vh; }
.site-header {
  position: sticky;
  top: 0;
  z-index: 20;
  border-bottom: 1px solid rgba(221, 228, 238, 0.88);
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(18px);
}
.header-inner {
  width: min(1180px, calc(100% - 40px));

  display: flex;
  align-items: center;
  gap: 32px;
}

  display: flex;
  align-items: center;

  text-align: left;

.desktop-nav { display: flex; align-self: stretch; align-items: stretch; gap: 8px; margin: 0 auto; }
.nav-button {
  position: relative;
  border: 0;
  background: transparent;
  padding: 0 18px;
  color: #5f6d80;
  font-size: calc(14px + var(--font-offset, 0px));
  font-weight: 650;
  cursor: pointer;
}
.nav-button::after { content: ""; position: absolute; left: 18px; right: 18px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: transparent; }
.nav-button:hover, .nav-button.active { color: var(--blue); }
.nav-button.active::after { background: var(--blue); }
.nav-button em { position: absolute; top: 15px; right: 4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 12px; background: var(--blue); color: #fff; font-size: calc(10px + var(--font-offset, 0px)); line-height: 18px; font-style: normal; }
.connection { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: calc(12px + var(--font-offset, 0px)); white-space: nowrap; }
.connection span { width: 8px; height: 8px; border-radius: 50%; background: #98a4b5; }
.connection.online span { background: #19a978; box-shadow: 0 0 0 5px rgba(25, 169, 120, .11); }
.connection.offline span { background: #d97706; }

.page-content { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 58px 0 80px; }
.hero-row { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 34px; }
.eyebrow, .section-kicker { margin: 0 0 10px; color: var(--blue); font-size: calc(11px + var(--font-offset, 0px)); line-height: 1; font-weight: 800; letter-spacing: .18em; }
.hero-row h1, .page-intro h1 { margin: 0; color: #14233c; font-size: clamp(32px, 4vw, 48px); line-height: 1.14; letter-spacing: -.04em; }
.hero-copy, .page-intro > p:last-child { margin: 12px 0 0; color: var(--muted); font-size: calc(16px + var(--font-offset, 0px)); line-height: 1.7; }
.refresh-button, .secondary-button {
  min-height: 44px;
  padding: 0 18px;
  border: 1px solid #dce4ef;
  border-radius: 12px;
  background: var(--paper);
  color: #3b4a61;
  font-weight: 700;
  font-size: calc(13px + var(--font-offset, 0px));
  box-shadow: 0 4px 16px rgba(38, 61, 91, .04);
  cursor: pointer;
}
.refresh-button:hover, .secondary-button:hover { border-color: #b9c9dc; color: var(--blue); }
.refresh-button:disabled { opacity: .6; cursor: wait; }
.search-panel { padding: 24px; border: 1px solid var(--line); border-radius: 20px; background: var(--paper); box-shadow: var(--shadow); }
.search-panel > label { display: block; margin-bottom: 10px; font-size: calc(13px + var(--font-offset, 0px)); font-weight: 750; }
.search-box { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border: 1px solid #dfe6ef; border-radius: 14px; background: #fafcff; transition: .2s ease; }
.search-box:focus-within { border-color: #78a9e9; box-shadow: 0 0 0 4px rgba(25, 103, 210, .09); background: #fff; }
.search-box > span { color: var(--blue); font-size: calc(27px + var(--font-offset, 0px)); line-height: 1; transform: rotate(-18deg); }
.search-box input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: calc(16px + var(--font-offset, 0px)); }
.search-box input::placeholder { color: #9aa6b7; }
.search-box .search-clear { min-height: 36px; display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto; padding: 0 12px; border: 1px solid #d7e2ef; border-radius: 10px; background: #fff; color: #66758a; white-space: nowrap; font-size: calc(11px + var(--font-offset, 0px)); font-weight: 700; cursor: pointer; transition: .18s ease; }
.search-box .search-clear span { color: var(--blue); font-size: calc(17px + var(--font-offset, 0px)); line-height: 1; }
.search-box .search-clear:hover { border-color: #9fbde5; background: var(--blue-soft); color: var(--blue); }
.search-panel > p { margin: 10px 2px 0; color: #8a97a8; font-size: calc(11px + var(--font-offset, 0px)); }
.service-tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 0 0 22px; }
.service-tab { min-height: 72px; display: grid; align-content: center; justify-items: start; gap: 4px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: #fff; color: #536177; text-align: left; cursor: pointer; transition: .18s ease; }
.service-tab:hover { border-color: #9ebfea; transform: translateY(-1px); }
.service-tab strong { font-size: calc(14px + var(--font-offset, 0px)); }
.service-tab small { color: #929dad; font-size: calc(9px + var(--font-offset, 0px)); }
.service-tab.active { border-color: var(--blue); background: var(--blue); color: #fff; box-shadow: 0 9px 25px rgba(25, 103, 210, .18); }
.service-tab.active small { color: rgba(255,255,255,.75); }

.summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 18px 0 46px; }
.summary-card { min-height: 118px; display: flex; gap: 14px; padding: 21px; border: 1px solid var(--line); border-radius: 17px; background: var(--paper); }
.summary-card p { margin: 0 0 8px; color: var(--muted); font-size: calc(12px + var(--font-offset, 0px)); }
.summary-card strong { display: block; overflow: hidden; color: #21304a; font-size: calc(20px + var(--font-offset, 0px)); text-overflow: ellipsis; white-space: nowrap; }
.summary-card small { display: block; margin-top: 7px; color: #98a3b3; font-size: calc(10px + var(--font-offset, 0px)); }
.summary-dot { width: 10px; height: 10px; margin-top: 4px; flex: 0 0 10px; border-radius: 50%; background: #8fa0b5; box-shadow: 0 0 0 5px #edf1f6; }
.summary-card.blue .summary-dot { background: var(--blue); box-shadow: 0 0 0 5px var(--blue-soft); }
.summary-card.green .summary-dot { background: var(--green); box-shadow: 0 0 0 5px var(--green-soft); }
.summary-card.amber .summary-dot { background: #e19023; box-shadow: 0 0 0 5px var(--amber-soft); }

.pages-finder-list button{border:0;border-radius:8px;padding:10px 11px;text-align:left;background:white;color:#17243b;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:7px;min-height:42px;cursor:pointer}
.pages-finder-list button.active{background:#e8f3f1;color:#146d78;font-weight:650}.pages-finder-list button:hover{background:#f2f7f6}
.pages-finder-list .finder-live{display:inline-block;width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:#0b8f6a;margin-right:7px}.pages-finder-list .finder-name{flex:1}.pages-finder-list .finder-arrow{font-size:12px;color:#78918b}
.pages-content{min-width:0}.pages-content .catalog-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.pages-content .summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pages-content .clinic-card{grid-template-columns:minmax(100px,1fr) 120px minmax(140px,1fr);gap:16px}.pages-content .clinic-card .alert-button{grid-column:1/-1;justify-self:end}
.pages-demo-bar{padding:10px 24px;background:#fff3d9;border-bottom:1px solid #edcf8b;color:#735318;font-size:13px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}.pages-demo-bar button{padding:5px 12px;border:1px solid #d9bb7b;border-radius:6px;background:white;cursor:pointer}.pages-demo-bar a{color:inherit}
.pages-error{padding:40px;max-width:600px;margin:40px auto;background:white;border:1px solid #e5eaf1;border-radius:14px}.pages-error button{padding:9px 18px;background:#1967d2;color:white;border:0;border-radius:8px;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e3a637;outline-offset:3px}
@media(max-width:1050px){.pages-clinic-layout{grid-template-columns:205px minmax(0,1fr);gap:18px}.pages-content .catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pages-content .clinic-card{grid-template-columns:minmax(0,1fr) 110px}.pages-content .stat-pair{grid-column:1/-1}.pages-content .clinic-card .alert-button{grid-column:1/-1}}
@media(max-width:720px){.pages-clinic-layout{grid-template-columns:1fr}.pages-finder{position:static;padding:16px}.pages-finder-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));max-height:230px;gap:3px}.pages-finder-list button{padding:9px 7px;font-size:12px;min-width:0}.pages-finder-list .finder-name{overflow-wrap:anywhere}.pages-content .catalog-grid{grid-template-columns:1fr}.pages-content .summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pages-demo-bar{padding:10px 14px;font-size:11px;gap:8px}.pages-content .clinic-card{grid-template-columns:minmax(0,1fr) 110px}}
